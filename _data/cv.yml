        highlights:
          - "Led development of machine learning and deep learning workflows using GRACE, GRACE-FO, IMERG, Sentinel, Landsat, and PlanetScope datasets."
          - "Built reproducible geospatial pipelines to preprocess and validate flood and water-storage signals."
          - "Generated publication-quality figures, grant reports, and interpreted remote-sensing outputs."
          - "Contributed to proposal development and reporting for climate change and geospatial research grants."

      - company: "Western Michigan University"
        position: "Teaching Assistant"
        location: "Kalamazoo, MI, USA"
        start_date: "2022"
        end_date: "2024"
        highlights:
          - "Taught laboratory sections in remote sensing, GIS, and UAV-related geoscience courses."
          - "Mentored student projects, graded assignments, and supported technical troubleshooting."
          - "Developed lab materials and tutorials for geospatial analysis workflows."

      - company: "Physics-aware Terrestrial Water Storage Forecasting Using a Climate Foundation Model"
        position: "ClimaX Foundation Model Project"
        location: "Great Basin, USA"
        start_date: "2025"
        end_date: "present"
        highlights:
          - "Fine-tuning ClimaX to forecast GRACE and GRACE-FO terrestrial water storage anomalies at three-month lead time."
          - "Designed strict out-of-sample validation over the 2020-2025 Great Basin drought period."
          - "Developed persistence and trend baselines, multi-seed ensembles, spatial NSE, bias, correlation maps, and regime-shift diagnostics."
          - "Developed a per-pixel trend-deflation strategy to preserve spatial hydroclimatic structure in pretrained transformer forecasts."

      - company: "Climate Extremes and Flood Modeling"
        position: "Remote Sensing and Hydrodynamic Modeling Research"
        start_date: "2025"
        end_date: "present"
        highlights:
          - "Implemented 2D hydrodynamic flood modeling and validated simulations using Sentinel-2 and PlanetScope observations."
          - "Applied extreme value theory with bootstrap confidence intervals to quantify flood probability shifts and uncertainty."
          - "Used GPM IMERG and GRACE-FO datasets to evaluate precipitation, runoff, and terrestrial water storage responses."

      - company: "Assessment of Sabkha and Dune Dynamics"
        position: "Collaborative Remote Sensing Research"
        start_date: "2025"
        end_date: "2025"
        highlights:
          - "Contributed to a collaborative project assessing sabkha and dune dynamics in Mecca and Riyadh Provinces."
          - "Supported data processing, interpretation, and report writing."

      - company: "Deep Learning for Large-scale Sand Dune Mapping"
        position: "Semantic Segmentation Research"
        start_date: "2024"
        end_date: "2024"
        highlights:
          - "Applied U-Net-based convolutional neural networks to PlanetScope, Sentinel-2, and Landsat imagery."
          - "Developed automated workflows for dune identification over the Arabian Peninsula."
          - "Supported scalable monitoring of geomorphologic change in arid environments."

      - company: "Machine Learning for Groundwater Quality Mapping"
        position: "Ensemble Machine Learning Research"
        start_date: "2024"
        end_date: "2024"
        highlights:
          - "Developed a stacking ensemble machine learning framework for groundwater-quality prediction."
          - "Applied model-evaluation methods including accuracy and ROC-based assessment."

      - company: "Machine Learning Optimization for Groundwater Quality Modeling"
        position: "Artificial Neural Network and Optimization Research"
        start_date: "2023"
        end_date: "2023"
        highlights:
          - "Applied artificial neural networks integrated with particle swarm optimization and grey wolf optimizer methods."
          - "Modeled and mapped groundwater quality across an unconfined aquifer in northern Iran."

